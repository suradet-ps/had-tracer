[workspace]
resolver = "3"
members = [
    "crates/had-tracer-core",
    "crates/had-tracer-config",
    "crates/had-tracer-hosxp",
    "crates/had-tracer-store",
    "crates/had-tracer-bridge",
    "apps/had-tracer-app",
    "apps/had-tracer-app/frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
authors = ["Suradet Pratomsak"]

[workspace.dependencies]
had-tracer-core = { path = "crates/had-tracer-core" }
had-tracer-config = { path = "crates/had-tracer-config" }
had-tracer-hosxp = { path = "crates/had-tracer-hosxp" }
had-tracer-store = { path = "crates/had-tracer-store" }
had-tracer-bridge = { path = "crates/had-tracer-bridge" }

async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
csv = "1.3"
directories = "6.0"
encryptman = "0.5.0"
encryptman-keyring = "0.1.3"
hex = "0.4"
js-sys = "0.3"
leptos = "0.8"
leptos_router = "0.8"
rfd = "0.17"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "sqlite", "chrono", "derive", "tls-rustls-ring-native-roots"] }
tauri = { version = "2", features = [] }
tauri-build = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Storage", "Location", "MouseEvent", "KeyboardEvent"] }
zeroize = { version = "1", features = ["serde"] }

[profile.dev]
incremental = true
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
